<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>REP</title>
  <meta name="description" content="REP: an offline workout tracker with progression nudges and a research-based rest timer.">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="REP">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="main"></main>
  <div id="timer" hidden></div>
  <nav id="nav" aria-label="Main">
    <button data-tab="workout"><span class="nav-ic" data-ic="train"></span>Train</button>
    <button data-tab="routines"><span class="nav-ic" data-ic="plans"></span>Plans</button>
    <button data-tab="progress"><span class="nav-ic" data-ic="progress"></span>Progress</button>
    <button data-tab="body"><span class="nav-ic" data-ic="body"></span>Body</button>
    <button data-tab="settings"><span class="nav-ic" data-ic="settings"></span>Settings</button>
  </nav>
  <div id="modal" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>REP needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
