<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lift Log</title>
  <meta name="description" content="Offline workout tracker with progression nudges and a research-based rest timer.">
  <meta name="theme-color" content="#111418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lift Log">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="main"></main>
  <div id="timer" hidden></div>
  <nav id="nav">
    <button data-tab="workout"><span>🏋️</span>Workout</button>
    <button data-tab="routines"><span>📋</span>Routines</button>
    <button data-tab="progress"><span>📈</span>Progress</button>
    <button data-tab="body"><span>⚖️</span>Body</button>
    <button data-tab="settings"><span>⚙️</span>Settings</button>
  </nav>
  <div id="modal" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Lift Log needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
